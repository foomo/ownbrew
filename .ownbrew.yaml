# yaml-language-server: $schema=ownbrew.schema.json
version: '1.1'

binDir: "bin"
tapDir: ".ownbrew/tap"
tempDir: ".ownbrew/tmp"
cellarDir: ".ownbrew/bin"
packages:
  ## https://github.com/golangci/golangci-lint/releases
  - name: golangci-lint
    tags: [ci]
    tap: foomo/tap/golangci/golangci-lint
    version: 2.12.2
  ## https://github.com/evilmartians/lefthook/releases
  - name: lefthook
    tap: foomo/tap/evilmartians/lefthook
    version: 2.1.8
